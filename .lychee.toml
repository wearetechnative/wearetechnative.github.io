# lychee link-checker config for the built site.
# Internal links must resolve; external links may warn (network-dependent, and
# some hosts rate-limit or block bots).

# Treat only internal/relative links as fatal; don't fail the build on external.
exclude_all_private = true

# External hosts we deliberately don't want to hard-fail on (bot-blocking,
# rate-limiting, or auth-walled). They still render on the page.
exclude = [
  "^https://www\\.linkedin\\.com",
  "^https://twitter\\.com",
  "^https://umami\\.pimsnel\\.com",
]

# Accept these HTTP statuses as OK (in addition to 2xx).
accept = ["200..=299", "429"]

# Don't check mailto/tel.
scheme = ["https", "http"]

# Be gentle with external hosts.
max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2
