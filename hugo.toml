baseURL = "https://wearetechnative.github.io/"
title = "TechNative Open Source"
defaultContentLanguage = "en"
enableRobotsTXT = true

# Single-page site: no taxonomies, no per-page URLs.
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The home page renders as HTML plus a JSON embed feed. The JSON output format
# is the built-in one with its filename pinned to `oss.json`, so the feed is
# published at the stable path https://wearetechnative.github.io/oss.json for
# technative.eu to consume at build time. See openspec change `oss-json-embed-feed`.
[outputs]
  home = ["HTML", "JSON"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "oss"
    isPlainText = true      # emit raw JSON, no HTML entity escaping
    notAlternative = true   # keep it out of alternate-link rendering

[params]
  description = "Open-source tools and modules from TechNative — cloud engineering, Terraform, NixOS, and the awesome lists."

# Category anchors (in approved display order). Empty categories are hidden at render time.
[[menu.main]]
  name = "ElastiNix"
  url = "#elastinix"
  weight = 10
[[menu.main]]
  name = "Terraform Modules"
  url = "#terraform-modules"
  weight = 20
[[menu.main]]
  name = "Tools"
  url = "#tools"
  weight = 30
[[menu.main]]
  name = "Quarto"
  url = "#quarto"
  weight = 35
[[menu.main]]
  name = "Awesome Lists"
  url = "#awesome-lists"
  weight = 40
[[menu.main]]
  name = "Other"
  url = "#other"
  weight = 50

[build]
  writeStats = false

[minify]
  disableXML = true
  minifyOutput = true
